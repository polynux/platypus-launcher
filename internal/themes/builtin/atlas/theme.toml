# Atlas: the /21 reference design (issues #122, #125). Tokens from
# tools/design-lab-2/src/designs/d21/d21.css (.d21 block). Not the default yet.

# The /21 stage is flat: no background glow.
wash = []

[theme]
id = "atlas"
name = "Atlas"
schema = 1
catalog = "1.0"
supports = ["tokens", "variants"]

[variants]
"shell.navigation" = "sourcebar"
"list-row.density" = "compact"
"game-row.mode" = "compact"
"view-header.size" = "compact"
"color.game-tone" = "whole"
"game-settings.presentation" = "sheet"
"game-settings.tabs" = "accordion"
"library.presentation" = "list-detail"
"game.structure" = "tabs"
"game-hero.logo" = "logo"
"label.style" = "plain"

[tokens]
ground = "#13161b"
ground-2 = "#15181d"
raised = "#181b21"
surface = "#1f232a"
surface-strong = "#293039"
hairline = "#262b33"
hairline-strong = "#36404b"
popover = "#1b1f26"
glass = "rgba(24, 27, 33, 0.82)"
text = "#e9edf2"
text-body = "#c3ccd8"
text-muted = "#9ca7b5"
text-faint = "#687384"
accent = "#9db0ff"
accent-strong = "#bccdff"
accent-dim = "#1f232a"
on-accent = "#0f1218"
ok = "#7ee2a8"
attention = "#e8b26a"
info = "#7dd3fc"
dl = "#c4b5fd"
danger = "#f0756a"
focus = "#9db0ff"
radius-chip = "7px"
radius-card = "12px"
radius-panel = "12px"
font-sans = '"Albert Sans Variable", system-ui, sans-serif'
font-mono = '"Geist Mono Variable", ui-monospace, monospace'

# Colour schemes (issue #134): token overrides from tintVars in
# tools/design-lab-2/src/core/app.js. Dark is [tokens] above; light and black
# replace the surfaces, lines, text and accent. Text-body and focus have no
# lab base: body is a dark slate that clears 4.5:1 on the light ground, focus
# follows the light accent so the ring stays visible. Danger follows the
# lab's .is-light bad override so errors read on the light ground.
[schemes.light]
ground = "#e9ecf0"
ground-2 = "#f1f3f6"
raised = "#f7f8fa"
surface = "#eceff3"
surface-strong = "#dfe3e9"
hairline = "#dde1e7"
hairline-strong = "#c4cad3"
popover = "#ffffff"
glass = "rgba(250, 251, 252, 0.86)"
text = "#161a20"
text-body = "#333f4e"
text-muted = "#525c6a"
text-faint = "#7a8494"
accent = "#3b5bdb"
accent-strong = "#3b5bdb"
accent-dim = "#dfe5f5"
on-accent = "#ffffff"
focus = "#3b5bdb"
danger = "#9d2a1e"

[schemes.black]
ground = "#000000"
ground-2 = "#05060a"
raised = "#08090c"
surface = "#121418"
surface-strong = "#1c1f25"
hairline = "#181b20"
hairline-strong = "#2a2f37"
popover = "#101216"
glass = "rgba(8, 9, 12, 0.82)"
accent = "#9db0ff"
accent-strong = "#bccdff"
accent-dim = "#0e1016"
on-accent = "#0f1218"
